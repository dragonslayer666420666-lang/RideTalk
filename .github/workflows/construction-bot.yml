name: RideTalk Construction Bot

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      request:
        description: Describe the RideTalk change to propose
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  copilot-requests: write

concurrency:
  group: construction-bot-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  propose-update:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[Construction Bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out RideTalk
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Capture the approved request
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          MANUAL_REQUEST: ${{ inputs.request }}
        run: node tools/construction-bot/request.mjs

      - name: Generate an exact replacement plan with GitHub Copilot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/construction-bot/generate.mjs

      - name: Apply the proposed code update
        run: node tools/construction-bot/apply.mjs

      - name: Run construction-bot checks
        run: node tools/construction-bot/validate.mjs index.html

      - name: Create a review branch and pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          branch="construction-bot/request-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git config user.name "RideTalk Construction Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add index.html .construction-bot
          git commit -m "Construction Bot: propose RideTalk update"
          git push --set-upstream origin "$branch"

          pr_url=$(gh pr create \
            --base main \
            --head "$branch" \
            --title "Construction Bot proposal" \
            --body-file .construction-bot/change-report.md)

          echo "Created $pr_url"

          if [[ "$EVENT_NAME" == "issues" && -n "${ISSUE_NUMBER:-}" ]]; then
            gh issue comment "$ISSUE_NUMBER" --body "The Construction Bot created a tested pull request for your approval: $pr_url

Nothing was merged automatically. Review the Files changed and Checks tabs before merging."
          fi
